<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Git branch (left side) -->
  <g fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 200 V96"/>
    <path d="M64 150 C64 118 112 130 112 98"/>
  </g>
  <circle cx="64" cy="80" r="15" fill="#60a5fa"/>
  <circle cx="64" cy="200" r="15" fill="#60a5fa"/>
  <circle cx="112" cy="82" r="15" fill="url(#accent)"/>
  <circle cx="64" cy="80" r="6" fill="#0f172a"/>
  <circle cx="64" cy="200" r="6" fill="#0f172a"/>
  <circle cx="112" cy="82" r="6" fill="#0f172a"/>

  <!-- Cloud (right side) -->
  <path fill="url(#cloud)"
        d="M136 196 h58 a30 30 0 0 0 4 -59.7 a40 40 0 0 0 -77 -9 a26 26 0 0 0 15 68.7 z"/>

  <!-- Upload arrow -->
  <g fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 190 V140"/>
    <path d="M146 162 L168 140 L190 162"/>
